name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/youtube-deep-analyzer/requirements.lock
      - name: Install Tesseract on macOS
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install Tesseract on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate distribution layout
        run: python3 scripts/validate_distribution.py
      - name: Install pinned runtime dependencies
        run: python3 -m pip install --requirement plugins/youtube-deep-analyzer/requirements.lock
      - name: Compile Python sources
        run: python3 -m compileall -q plugins/youtube-deep-analyzer/scripts scripts
      - name: Run unit and native OCR integration tests
        env:
          YOUTUBE_DEEP_ANALYZER_REQUIRE_OCR_TESTS: "1"
        run: python3 -m unittest discover -s plugins/youtube-deep-analyzer/scripts -p 'test_*.py'
      - name: Check Codex and Claude MCP startup without a shell launcher
        env:
          YOUTUBE_DEEP_ANALYZER_AUTO_UPDATE: "0"
        run: python3 scripts/check_mcp_hosts.py
