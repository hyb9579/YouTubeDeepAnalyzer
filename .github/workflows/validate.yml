name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/youtube-deep-analyzer/requirements.lock
      - name: Validate distribution layout
        run: python3 scripts/validate_distribution.py
      - name: Install pinned runtime dependencies
        run: python3 -m pip install --requirement plugins/youtube-deep-analyzer/requirements.lock
      - name: Compile Python sources
        run: python3 -m compileall -q plugins/youtube-deep-analyzer/scripts scripts
      - name: Run unit tests
        run: python3 -m unittest discover -s plugins/youtube-deep-analyzer/scripts -p 'test_*.py'
      - name: Check Codex and Claude MCP startup
        env:
          YOUTUBE_DEEP_ANALYZER_AUTO_UPDATE: "0"
        run: |
          export YOUTUBE_DEEP_ANALYZER_BASE_RUNTIME="$(python3 -c 'import site; print(site.getsitepackages()[0])')"
          python3 plugins/youtube-deep-analyzer/scripts/smoke_test_mcp.py --host codex
          python3 plugins/youtube-deep-analyzer/scripts/smoke_test_mcp.py --host claude
